[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elink"
version = "0.6.3"
description = "低延迟远程控制与串流：屏幕采集、H.264 编码、MPEG-TS/SRT 传输、PySide6 桌面端"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]
e2ee = ["cryptography>=43.0"]

[project.scripts]
elink = "backend.app:run"
elink-ui = "frontend.desktop.app:main"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
frontend = [
    "desktop/resources/*.dll",
    "desktop/resources/*.ico",
    "desktop/resources/*.png",
    "desktop/resources/*.jpg",
    "desktop/resources/fsr/*.h",
    "desktop/resources/lucide/*.svg",
    "mobile/*.html",
    "mobile/*.json",
    "mobile/assets/*.css",
    "mobile/js/*.js",
    "shared/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
