name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ffmpeg -version
      - name: Install package and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend regression suites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          python -m scripts.check 2>&1 | Tee-Object -FilePath out/regression.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content out/regression.log -Tail 150) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Regression failure::$details"
          }
          exit $code
      - name: Run frozen-style UI self-test
        shell: pwsh
        run: |
          $env:ELINK_SELFTEST_HEADLESS = '1'
          $env:ELINK_DATA_DIR = Join-Path $env:TEMP 'elink-ci-data'
          python main.py --self-test out/self-test.json
          $code = $LASTEXITCODE
          if (Test-Path out/self-test.json) {
            $report = Get-Content out/self-test.json -Raw | ConvertFrom-Json
            if (-not $report.ok) { exit 1 }
          } else {
            exit 1
          }
          exit $code
      - name: Print self-test report on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path out/self-test.json) { Get-Content out/self-test.json }
      - name: Upload self-test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-self-test
          path: |
            out/self-test.json
            out/self-test-ui.png
          if-no-files-found: warn
