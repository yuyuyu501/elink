name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          choco install innosetup --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ffmpeg -version
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse | Where-Object Length -gt 1MB | Select-Object -First 1
          if (-not $binary) { throw 'Actual ffmpeg distribution not found' }
          "ELINK_FFMPEG_DIR=$($binary.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os; from frontend.desktop import __version__; tag=os.environ['GITHUB_REF_NAME']; assert tag == f'v{__version__}', f'tag {tag} != v{__version__}'"
      - name: Install package and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build portable ZIP and verified installer
        env:
          VSLANG: "1033"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $python = (Get-Command python).Source
          $process = Start-Process -FilePath $python -ArgumentList '-m','scripts.package_windows','--dist-dir','dist' -NoNewWindow -Wait -PassThru -RedirectStandardOutput out/package.out -RedirectStandardError out/package.err
          Get-Content out/package.out -Tail 120
          Get-Content out/package.err -Tail 120
          if ($process.ExitCode -ne 0) {
            $details = (Get-Content out/package.out,out/package.err -Tail 120) -join "`n"
            $details = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Package failure::$details"
          }
          exit $process.ExitCode
      - name: Print package log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path out/package.out) { Get-Content out/package.out -Tail 200 }
          if (Test-Path out/package.err) { Get-Content out/package.err -Tail 200 }
          if (Test-Path dist/Elink/self-test.json) { Get-Content dist/Elink/self-test.json }
      - name: Show package summary
        run: Get-Content dist/package-summary.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: elink-windows-x64
          path: |
            dist/*/Elink-*-windows-x64.zip
            dist/*/Elink-*-windows-x64-setup.exe
            dist/*/SHA256SUMS.txt
            dist/*/verification.json
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Elink ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*/Elink-*-windows-x64.zip
            dist/*/Elink-*-windows-x64-setup.exe
            dist/*/SHA256SUMS.txt
            dist/*/verification.json
          body_path: releases/${{ github.ref_name }}.md
